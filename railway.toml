# OpenCode Remote Agent - Railway Deployment

# This deploys just the frontend
# Your backend is already deployed on Railway

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[deploy]
startCommand = "nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
# Optional: Pre-configure the default backend URL
# Users can still add other servers in the UI
VITE_DEFAULT_API_URL = "https://your-opencode-backend.railway.app"

# Network settings
PORT = "80"